# Application
spring.application.name=servicedesk-backend
server.port=8080

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/servicedesk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# JWT Configuration
jwt.secret=${JWT_SECRET:554034cf5e2c27bd8f5b328ba5c8e9d5abf6566be310fb6b04d594375c0a2cb3}
jwt.expiration-ms=86400000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always